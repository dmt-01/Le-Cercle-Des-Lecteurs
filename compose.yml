###############################################################################
# compose.yml — configuration de base (production)
#
# Utilisé seul pour la prod :
#   docker compose --env-file .env.prod up --build
#
# Surchargé par compose.dev.yml pour le dev :
#   docker compose -f compose.yml -f compose.dev.yml --env-file .env.dev up --build
#
# Surchargé par compose.preprod.yml pour la preprod :
#   docker compose -f compose.yml -f compose.preprod.yml --env-file .env.preprod up --build
###############################################################################

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_REFRESH_SECRET: ${BACKEND_JWT_REFRESH_SECRET}
      JWT_REFRESH_TTL: ${BACKEND_JWT_REFRESH_TTL}
      JWT_ACCESS_SECRET: ${BACKEND_JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${BACKEND_JWT_ACCESS_TTL}
      CORS_ALLOWED: ${BACKEND_CORS_ALLOWED}
      NODE_ENV: prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:3000"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
      args:
        # VITE_API_BASE_URL est une variable Vite — elle doit être passée
        # en build arg car elle est injectée dans le bundle au moment du build
        VITE_API_BASE_URL: ${FRONTEND_VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  db_data:
