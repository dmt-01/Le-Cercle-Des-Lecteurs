server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Toutes les routes sont redirigées vers index.html (Single Page Application)
    # Sans ça, un rafraîchissement sur /books/123 renverrait une 404 nginx
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long terme pour les assets Vite (les noms de fichiers contiennent un hash)
    # ex: main-BxYz1234.js → peut être mis en cache indéfiniment
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
